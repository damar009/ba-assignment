<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
  padding: 40px;
}

.profile {
  margin-bottom: 30px;
}

.profile img {
  width: 120px;
  border-radius: 50%;
}

.links a {
  display: block;
  background: #1f1f1f;
  color: white;
  text-decoration: none;
  padding: 15px;
  margin: 10px auto;
  max-width: 400px;
  border-radius: 10px;
  transition: 0.2s;
}

.links a:hover {
  background: #333;
}
</style>
</head>

<body>

<div class="profile">
  <img src="https://via.placeholder.com/120">
  <h2>Damar Achmad</h2>
  <p>Web Developer</p>
</div>

<div class="links">
  <a href="https://instagram.com/">Instagram</a>
  <a href="https://github.com/">GitHub</a>
  <a href="https://linkedin.com/">LinkedIn</a>
  <a href="https://youtube.com/">YouTube</a>
</div>

</body>
</html>
